<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>数字孪生电力系统 · 边界导入</title><link rel="stylesheet" href="/styles.css"></head>
<body data-page="boundary"><main class="shell"><header class="topbar"><div><span class="eyebrow">BOUNDARY INPUT</span><h1>外部边界导入</h1><p>加载风、光、荷、温度、柴发和储能边界数据</p></div><div class="clock"><strong id="simTime">00:00:00</strong><span id="runState">运行中</span><div class="clock-actions"><button data-clock="start">启动</button><button data-clock="pause">暂停</button><button data-clock="step">单步</button></div></div></header><nav class="nav"></nav><section class="page-heading"><div><span class="eyebrow">BOUNDARY</span><h2>边界数据导入</h2><p>导入成功后立即合并到当前仿真曲线。</p></div><span id="curveStatus" class="badge">实时</span></section><article class="card boundary-card"><div class="card-title">加载风光荷温边界 <small>按仿真时钟循环插值</small></div><p class="hint">支持 CSV、TSV、JSON、weather.e、curves.e 和 ZIP。缺失列保留原有通道。</p><div class="file-row"><input id="boundaryFile" type="file" accept=".csv,.tsv,.json,.e,.zip" aria-label="选择边界文件"><button id="importBoundary" class="primary">导入并应用</button><button id="downloadBoundaryExample">示例 CSV</button></div><p id="boundaryMessage" class="notice" role="status"></p><div class="card-actions"><label>曲线 <select id="boundarySeries" aria-label="预览曲线"></select></label><button id="boundaryPrevious">上一页</button><span id="boundaryPage"></span><button id="boundaryNext">下一页</button></div><div id="boundaryPreview" class="table-wrap"></div></article></main><script src="/nav.js"></script><script src="/app.js"></script><script src="/boundary.js"></script></body>
