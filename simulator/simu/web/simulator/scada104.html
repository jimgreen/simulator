<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模拟台 · IEC104 联动</title>
  <script>
    try {
      const rawTheme = localStorage.getItem("polarUiTheme");
      const darkThemes = new Set(["precision-dark", "glassmorphism", "sci-fi"]);
      const validThemes = new Set([
        "minimalist-light",
        "precision-dark",
        "bento-grid",
        "glassmorphism",
        "editorial",
        "neo-brutalism",
        "sci-fi",
      ]);
      const resolved = rawTheme === "dark"
        ? "precision-dark"
        : (rawTheme === "light" || !validThemes.has(rawTheme) ? "minimalist-light" : rawTheme);
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.colorScheme = darkThemes.has(resolved) ? "dark" : "light";
    } catch (_e) {
      document.documentElement.dataset.theme = "minimalist-light";
      document.documentElement.dataset.colorScheme = "light";
    }
  </script>
  <link rel="stylesheet" href="/scada104.css?v=20261123-themes">
  <script src="/scada104.js?v=20261123-themes" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1>IEC104 联动</h1>
      </div>
      <nav class="tab-nav" aria-label="IEC104 视图切换" role="tablist">
        <button type="button" class="tab-btn is-active" data-view-tab="channels" role="tab" aria-selected="true">通道与指令</button>
        <button type="button" class="tab-btn" data-view-tab="points" role="tab" aria-selected="false">四遥点表</button>
        <button type="button" class="tab-btn" data-view-tab="logs" role="tab" aria-selected="false">通信日志</button>
      </nav>
      <div class="topbar-right">
        <a class="nav-link" href="/">返回模拟台</a>
        <a id="externalScadaLink" class="nav-link" href="#" target="_blank" rel="noopener" hidden>SCADA 工作台</a>
        <label class="theme-switcher" title="选择界面风格">
          <span class="theme-switcher-label">风格</span>
          <select id="themeSelector" class="theme-select" aria-label="选择界面风格">
            <option value="minimalist-light">极简明亮</option>
            <option value="precision-dark">精密暗黑</option>
            <option value="bento-grid">便当盒网格</option>
            <option value="glassmorphism">毛玻璃拟态</option>
            <option value="editorial">编辑杂志</option>
            <option value="neo-brutalism">新粗野主义</option>
            <option value="sci-fi">科幻战情</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <main>
    <p id="database" class="path"></p>
    <p id="bridgeError" class="status-banner is-error" role="status"></p>

    <div data-view-pane="channels">
      <section class="card" aria-label="模型通道状态">
        <div class="card-head">
          <h2>模型通道状态</h2>
          <div class="card-actions">
            <button id="refreshStatusBtn" class="ghost-btn" type="button" title="立即刷新模型通道状态">刷新状态</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>模型</th>
                <th class="num">RTU</th>
                <th class="mono">IEC104 地址</th>
                <th>状态</th>
                <th class="num">YC / YX / YK / YT</th>
                <th>通道与点表操作</th>
              </tr>
            </thead>
            <tbody id="modelRows"><tr><td colspan="6" class="empty">正在读取模型</td></tr></tbody>
          </table>
        </div>
      </section>

      <section class="card" aria-labelledby="commandTitle">
        <div class="card-head">
          <h2 id="commandTitle">下发仿真指令</h2>
          <div class="card-actions">
            <input id="pointSearch" class="search-input" type="search" placeholder="筛选控制点名称或点号…" aria-label="筛选控制点">
            <button id="refreshPointsBtn" class="ghost-btn" type="button" title="重新读取当前模型控制点列表">刷新点表</button>
          </div>
        </div>
        <form id="commandForm">
          <label>模型
            <select id="rtu" required><option value="">选择模型</option></select>
          </label>
          <label>类型
            <select id="kind">
              <option value="yk">遥控 YK</option>
              <option value="yt">遥调 YT</option>
            </select>
          </label>
          <label class="field-wide">控制点
            <select id="point" required><option value="">请先选择模型</option></select>
          </label>
          <label>指令值
            <select id="valueSelect" required>
              <option value="1">1 · 合 / 投入</option>
              <option value="0">0 · 分 / 退出</option>
            </select>
            <input id="value" type="number" step="any" placeholder="输入设定值" hidden>
          </label>
          <button id="send" class="primary" type="submit">核对并下发</button>
        </form>
        <p id="pointMeta" class="point-meta"></p>
        <p id="receipt" class="status-banner" role="status"></p>
        <ul id="recentReceipts" class="receipt-history" aria-label="最近指令记录"></ul>
      </section>
    </div>

    <div data-view-pane="points" hidden>
      <section class="card" aria-label="四遥点表">
        <div class="card-head">
          <h2>四遥点表</h2>
          <div class="card-actions">
            <select id="pointsRtuSelect" aria-label="点表模型"></select>
            <select id="pointsKindSelect" aria-label="四遥类型">
              <option value="yc">遥测 YC</option>
              <option value="yx">遥信 YX</option>
              <option value="yk">遥控 YK</option>
              <option value="yt">遥调 YT</option>
            </select>
            <input id="pointsTableSearch" class="search-input" type="search" placeholder="筛选测点名称或点号…" aria-label="筛选四遥点表">
            <button id="reloadPointsTableBtn" class="ghost-btn" type="button">刷新</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="num">点号</th>
                <th>测点名称</th>
                <th class="mono">仿真源名</th>
                <th class="num">当前值</th>
                <th>质量/状态</th>
                <th>操作控制</th>
              </tr>
            </thead>
            <tbody id="pointsTableBody"><tr><td colspan="6" class="empty">请选择模型查看点表</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>

    <div data-view-pane="logs" hidden>
      <section class="card" aria-label="IEC104 通信日志">
        <div class="card-head">
          <h2>IEC104 通信日志</h2>
          <div class="card-actions">
            <select id="logsRtuSelect" aria-label="日志模型"></select>
            <button id="reloadLogsBtn" class="ghost-btn" type="button">刷新日志</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="mono">时间</th>
                <th>级别</th>
                <th>内容</th>
              </tr>
            </thead>
            <tbody id="logsTableBody"><tr><td colspan="3" class="empty">请选择模型查看通信日志</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <dialog id="scadaConfirmDialog" class="confirm-dialog" aria-labelledby="scadaConfirmTitle">
    <div class="confirm-card">
      <div class="confirm-head">
        <span class="confirm-badge">操作核对</span>
        <h2 id="scadaConfirmTitle">确认执行操作？</h2>
      </div>
      <p id="scadaConfirmDetail" class="confirm-detail"></p>
      <div class="confirm-actions">
        <button id="scadaConfirmCancel" type="button">取消</button>
        <button id="scadaConfirmOk" class="primary" type="button">确认执行</button>
      </div>
    </div>
  </dialog>
</body>
</html>
