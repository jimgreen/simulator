<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模拟台 · IEC104 联动</title>
  <link rel="stylesheet" href="/scada104.css">
  <script src="/scada104.js" defer></script>
</head>
<body>
  <header>
    <h1>IEC104 联动</h1>
    <nav aria-label="SCADA 工作台">
      <a href="/channels">通道参数</a>
      <a href="/points">四遥点表</a>
      <a href="/communication">通信监视</a>
      <a href="/logs">通信日志</a>
    </nav>
  </header>
  <main>
    <p id="database" class="path"></p>
    <section aria-label="模型服务">
      <table>
        <thead><tr><th>模型</th><th>RTU</th><th>IEC104</th><th>状态</th><th>YC / YX / YK / YT</th><th>点表</th></tr></thead>
        <tbody id="modelRows"><tr><td colspan="6">正在读取模型</td></tr></tbody>
      </table>
      <p id="bridgeError" class="error" role="status"></p>
    </section>
    <section aria-labelledby="commandTitle">
      <h2 id="commandTitle">下发仿真指令</h2>
      <form id="commandForm">
        <label>模型<select id="rtu" required><option value="">选择模型</option></select></label>
        <label>类型<select id="kind"><option value="yk">遥控 YK</option><option value="yt">遥调 YT</option></select></label>
        <label>点号<input id="point" type="number" min="1" step="1" required></label>
        <label>指令值<input id="value" type="number" step="any" required></label>
        <button id="send" type="submit">核对并下发</button>
      </form>
      <p id="receipt" role="status"></p>
    </section>
  </main>
</body>
</html>
